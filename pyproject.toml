[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial_mesh"
version = "0.1.0"
description = "Wave-based spatiotemporal perception mesh for robot spatial intelligence."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.5",
  "networkx>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-dir]
"" = "."
